<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca | EntreLibros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="navbar__container">
    <a href="index.html" class="navbar__logo">Entre<span>Libros</span></a>
    <button class="btn btn--outline" id="btn-sesion">Iniciar sesión</button>
  </div>
</header>

  <section class="hero">
    <h1>Encontrá tu <span>próxima</span> gran lectura</h1>
    <p>Descubrí libros, leé reseñas de otros lectores y explorá recomendaciones.</p>
    <a href="catalogo.html" class="btn btn--primary">Explorar catálogo</a>
  </section>

  <section class="carrusel-section">
    <h2 class="carrusel-titulo">Libros destacados</h2>

    <div class="carrusel">
      <div class="carrusel__track" id="carrusel-track">
      </div>
    </div>

    <div class="carrusel__nav" id="carrusel-nav">
    </div>
  </section>
<nav class="tabbar">
  <a href="index.html" class="tabbar__item is-active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span>Inicio</span>
  </a>
  <a href="catalogo.html" class="tabbar__item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    <span>Catálogo</span>
  </a>
  <a href="perfil.html" class="tabbar__item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Perfil</span>
  </a>
</nav>
<script src="libros.js"></script>
<script src="resenas.js"></script>
<script src="sesion.js"></script>
<script>
  const pista = document.getElementById("carrusel-track");
  const puntos = document.getElementById("carrusel-nav");

  // Los libros destacados salen de la tabla libros
  cargarLibros()
    .then(lista => {
      const destacados = lista.slice(0, 8);

      pista.innerHTML = destacados.map(l => `
        <a class="libro-card" id="libro${l.id}" href="libro.html?id=${l.id}">
          <img src="${escapar(l.portada)}" alt="Portada de ${escapar(l.titulo)}">
        </a>`).join("");

      puntos.innerHTML = destacados.map(l => `
        <a href="#" class="carrusel__dot" data-libro="${l.id}" aria-label="Ir a ${escapar(l.titulo)}"></a>`).join("");

      puntos.addEventListener("click", e => {
        const punto = e.target.closest("[data-libro]");
        if (!punto) return;
        e.preventDefault();
        const tarjeta = document.getElementById(`libro${punto.dataset.libro}`);
        if (tarjeta) tarjeta.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
      });
    })
    .catch(error => {
      console.error(error);
      pista.innerHTML = `<p class="perfil-vacio">No pudimos cargar los libros. Probá recargar la página.</p>`;
    });
</script>
</body>
</html>
