<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | EntreLibros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar__container">
      <a href="index.html" class="navbar__logo">Entre<span>Libros</span></a>
      <nav class="navbar__nav">
        <ul class="navbar__links">
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="catalogo.html" class="is-active">Catálogo</a></li>
          <li><a href="index.html#recomendaciones">Recomendaciones</a></li>
          <li><a href="index.html#lista">Lista</a></li>
        </ul>
        <button class="btn btn--outline">Iniciar sesión</button>
      </nav>
    </div>
  </header>


  <!-- CATÁLOGO -->
  <section class="catalogo-section" id="catalogo">
    <h2 class="carrusel-titulo">Catálogo</h2>

    <div class="catalogo-grid" id="catalogo-grid">
    </div>
  </section>

  <script src="libros.js"></script>
  <script>
    const grid = document.getElementById("catalogo-grid");

    grid.innerHTML = libros.map(libro => `
      <a href="libro.html?id=${libro.id}" class="catalogo-card">
        <div class="catalogo-card__portada">
          <img src="${libro.portada}" alt="Portada de ${libro.titulo}">
        </div>
        <div class="catalogo-card__info">
          <h3>${libro.titulo}</h3>
          <p class="catalogo-card__autor">${libro.autor}</p>
          <div class="catalogo-card__meta">
            <span class="catalogo-card__genero">${libro.genero}</span>
            <span class="catalogo-card__estrellas">★ ${libro.rating}</span>
          </div>
        </div>
      </a>
    `).join("");
  </script>


</body>
</html>
