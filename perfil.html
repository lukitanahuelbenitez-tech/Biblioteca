<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | EntreLibros</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar__container">
      <a href="index.html" class="navbar__logo">Entre<span>Libros</span></a>
      <button class="btn btn--outline" id="btn-sesion">Iniciar sesión</button>
    </div>
  </header>

  <main>
    <section class="perfil-cabecera">
      <div class="perfil-avatar" id="perfil-avatar"></div>
      <h1 class="perfil-nombre" id="perfil-nombre">Nombre de usuario</h1>
      <button class="btn btn--outline" id="btn-editar-perfil">Editar perfil</button>
    </section>

    <nav class="perfil-tabs">
      <a href="#" class="perfil-tab is-active" data-tab="perfil">Perfil</a>
      <a href="#" class="perfil-tab" data-tab="diario">Diario</a>
      <a href="#" class="perfil-tab" data-tab="resenas">Reseñas</a>
      <a href="#" class="perfil-tab" data-tab="watchlist">Watchlist</a>
    </nav>

    <!-- PERFIL -->
    <div class="perfil-panel is-active" id="panel-perfil">
      <section class="perfil-seccion" id="seccion-favoritos" hidden>
        <h2>Favoritos</h2>
        <div class="fila-portadas" id="perfil-favoritos"></div>
      </section>

      <section class="perfil-seccion">
        <h2>Actividad reciente</h2>
        <div class="fila-portadas" id="perfil-actividad"></div>
      </section>

      <section class="perfil-seccion">
        <h2>Calificaciones <span id="ratings-total"></span></h2>
        <div id="perfil-ratings"></div>
      </section>

      <section class="perfil-seccion">
        <h2>Estadísticas</h2>
        <div class="stats-lista" id="perfil-stats"></div>
      </section>
    </div>

    <!-- DIARIO -->
    <div class="perfil-panel" id="panel-diario">
      <section class="perfil-seccion">
        <h2>Diario</h2>
        <div id="perfil-diario"></div>
      </section>
    </div>

    <!-- RESEÑAS -->
    <div class="perfil-panel" id="panel-resenas">
      <section class="perfil-seccion">
        <h2>Reseñas</h2>
        <div id="perfil-resenas"></div>
      </section>
    </div>

    <!-- WATCHLIST -->
    <div class="perfil-panel" id="panel-watchlist">
      <section class="perfil-seccion">
        <h2>Watchlist</h2>
        <div class="grid-portadas" id="perfil-watchlist"></div>
      </section>
    </div>

    <!-- VISTA GENÉRICA (Libros, Este año, Likes, Listas) -->
    <div class="perfil-panel" id="panel-vista">
      <section class="perfil-seccion">
        <button type="button" class="vista-volver" id="vista-volver">‹ Perfil</button>
        <h2 id="vista-titulo"></h2>
        <div id="vista-contenido"></div>
      </section>
    </div>
  </main>

  <dialog class="dialogo-perfil" id="dialogo-editar">
    <h2>Editar perfil</h2>
    <p class="dialogo-ayuda">Tus 4 libros favoritos. Tocá un lugar y buscá el libro.</p>

    <div class="fila-portadas" id="slots-favoritos"></div>

    <div class="buscador" id="buscador-favoritos" hidden>
      <input type="search" id="input-buscar-fav" placeholder="Buscar por título o autor..." autocomplete="off">
    </div>
    <div class="resultados" id="resultados-favoritos"></div>

    <div class="dialogo-acciones">
      <button type="button" class="btn btn--outline" id="btn-cancelar">Cancelar</button>
      <button type="button" class="btn btn--primary" id="btn-guardar">Guardar</button>
    </div>
  </dialog>

  <nav class="tabbar">
    <a href="index.html" class="tabbar__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Inicio</span>
    </a>
    <a href="catalogo.html" class="tabbar__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Catálogo</span>
    </a>
    <a href="perfil.html" class="tabbar__item is-active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Perfil</span>
    </a>
  </nav>

  <script src="libros.js"></script>
  <script src="resenas.js"></script>
  <script src="sesion.js"></script>
  <script src="perfil.js"></script>
</body>
</html>
