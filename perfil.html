  <main>
    <section class="perfil-cabecera">
      <div class="perfil-avatar"></div>
      <h1 class="perfil-nombre" id="perfil-nombre">Nombre de usuario</h1>
      <div class="perfil-stats">
        <div class="perfil-stat">
          <strong id="stat-resenas">0</strong>
          <span>Reseñas</span>
        </div>
        <div class="perfil-stat">
          <strong id="stat-favoritos">0</strong>
          <span>Favoritos</span>
        </div>
      </div>
    </section>

    <section class="perfil-seccion">
      <h2>Mis favoritos</h2>
      <div class="perfil-favoritos" id="perfil-favoritos">

        </div>

          <div class="libro-fav-portada"></div>
          <span>Título del libro</span>
        </div>
        <div class="libro-fav">

        </div>
        <div class="libro-fav">
          <div class="libro-fav-portada"></div>
          <span>Título del libro</span>
        </div>
      </div>
    </section>

    <section class="perfil-seccion">
      <h2>Últimas reseñas</h2>
      <div id="perfil-resenas">
        <article class="resena-item">
          <h3>Título del libro</h3>
          <p class="resena-puntaje">★★★★☆</p>
          <p>Texto de ejemplo de la reseña.</p>
        </article>
        <article class="resena-item">
          <h3>Otro libro</h3>
          <p class="resena-puntaje">★★★☆☆</p>
          <p>Otro texto de ejemplo.</p>
        </article>
      </div>
    </section>
